# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Controller\WeatherApiController:
        autowire: true
        autoconfigure: true
        tags: ['controller.service_arguments']

    App\Service\NewsFocusService:
        arguments:
            $cache: '@cache.app'
            $newsApiKey: '%env(string:NEWSAPI_KEY)%'
            $mediastackKey: '%env(string:MEDIASTACK_KEY)%'

    # alias so that we can swap provider implementations if needed
    App\Service\AI\AIProviderInterface: '@App\Service\AI\OpenAIProvider'

    App\EventSubscriber\AIEntitySubscriber:
        tags: ['doctrine.event_subscriber']
        arguments:
            - '@App\Service\AISuccessAnalyzer'
            - '@App\Service\AIRiskAnalyzer'

    App\Service\EmotionalAssistantService:
        arguments:
            $emotionApiUrl: '%env(string:EMOTION_API_URL)%'
            $emotionApiKey: '%env(string:EMOTION_API_KEY)%'
            $huggingFaceApiKey: '%env(string:HUGGINGFACE_API_KEY)%'
            $huggingFaceModel: '%env(string:HUGGINGFACE_MODEL)%'

    App\Service\GoalAnalysisService:
        arguments:
            $apiUrl: '%env(string:GOAL_ANALYSIS_API_URL)%'
            $apiKey: '%env(string:GOAL_ANALYSIS_API_KEY)%'
